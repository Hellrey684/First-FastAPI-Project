<!DOCTYPE html>
<html>
<head>
    <title>Мои товары</title>
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background: #f4f6f9;
        display: flex;
        justify-content: center;
        padding: 30px 15px;
        min-height: 100vh;
    }

    .container {
        max-width: 700px;
        width: 100%;
        background: white;
        padding: 25px 30px;
        border-radius: 20px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.1);
    }

    h1 {
        text-align: center;
        color: #1e2a3a;
        font-weight: 600;
        margin-bottom: 25px;
        font-size: 28px;
    }

    .form-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 25px;
    }

    .form-row input {
        flex: 1;
        min-width: 140px;
        padding: 10px 14px;
        border: 1px solid #d0d7de;
        border-radius: 10px;
        font-size: 15px;
        background: #f9fafb;
        transition: 0.2s;
    }

    .form-row input:focus {
        outline: none;
        border-color: #2563eb;
        background: white;
        box-shadow: 0 0 0 3px rgba(37,99,235,0.2);
    }

    .form-row button {
        padding: 10px 22px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        transition: 0.2s;
        white-space: nowrap;
    }

    .form-row button:hover {
        background: #1d4ed8;
        transform: scale(1.02);
    }

    ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 16px;
        background: #f9fafb;
        border-radius: 12px;
        margin-bottom: 10px;
        border: 1px solid #e9edf2;
        transition: 0.15s;
    }

    li:hover {
        background: #f1f4f9;
        border-color: #cbd5e1;
    }

    .item-info {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
        font-size: 15px;
    }

    .item-name {
        font-weight: 600;
        color: #1e2a3a;
    }

    .item-price {
        color: #2d3748;
    }

    .item-offer {
        background: #dbeafe;
        color: #1e40af;
        font-size: 12px;
        padding: 2px 10px;
        border-radius: 20px;
        font-weight: 500;
    }

    .delete-btn {
        background: #ef4444;
        color: white;
        border: none;
        padding: 6px 14px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: 0.15s;
        flex-shrink: 0;
    }

    .delete-btn:hover {
        background: #dc2626;
        transform: scale(1.04);
    }

    .empty-message {
        text-align: center;
        color: #6b7280;
        padding: 30px 0;
        font-size: 16px;
    }

    .footer-links {
        margin-top: 25px;
        text-align: center;
        font-size: 14px;
        color: #6b7280;
        border-top: 1px solid #e5e7eb;
        padding-top: 18px;
    }

    .footer-links a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 500;
    }

    .footer-links a:hover {
        text-decoration: underline;
    }
</style>
</head>
<body>
    <div class="container">
        <h1>📦 Мои товары</h1>

        <div class="form-row">
            <input type="text" id="name" placeholder="Название товара">
            <input type="number" id="price" placeholder="Цена">
            <button onclick="addItem()">➕ Добавить</button>
        </div>

        <ul id="itemsList"></ul>

        <div class="footer-links">
            <span>🔗 API: </span>
            <a href="https://first-fastapi-project-y0ve.onrender.com" target="_blank">first-fastapi-project-y0ve.onrender.com</a>
        </div>
    </div>

    <script>
        // твой существующий JS-код (без изменений)
    </script>
</body>
</html>
